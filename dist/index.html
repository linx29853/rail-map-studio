<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沿线 · 日式线路图制作</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath stroke='%23007861' stroke-width='6' d='M3 16h26'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white' stroke='%23007861' stroke-width='3'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#17262d;font:16px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cad3d9;background:white;color:#20323a;border-radius:7px;padding:8px 14px}button:hover{background:#edf5f3}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #76b8ff;outline-offset:2px}.primary{background:#007861;color:white;border-color:#007861}.primary:hover{background:#00614e}header{padding:20px 30px;background:#102f36;color:white;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header h1{margin:0;font-size:24px;font-weight:600}header span{color:#c2d6dc;font-size:14px}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;padding:24px;max-width:1800px;margin:auto}aside,.panel{background:white;border:1px solid #d7e0e5;border-radius:12px;padding:20px}h2{font-size:18px;margin:0 0 15px}h3{font-size:16px;margin:22px 0 12px}.field{display:block;margin-bottom:14px;font-size:14px}.field input,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid #bdcbd2;border-radius:6px;padding:9px;background:#fff;color:#17262d}.field textarea{min-height:250px;resize:vertical}.hint{font-size:14px;color:#53666f;margin:8px 0 16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .field{flex:1;min-width:95px}input[type=color]{min-width:42px;height:40px;padding:3px!important}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar h2{margin:0}.preview{overflow:auto;background:#fff;border:1px solid #d9e1e5;border-radius:5px}.preview svg{display:block}.editor{margin-top:22px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 8px;text-align:center;border-bottom:1px solid #e1e7eb}th{background:#f5f8fa;font-weight:500;white-space:nowrap}th:first-child,td:first-child{text-align:left;min-width:140px}td input[type=text]{width:170px;border:1px solid #cad3d9;padding:6px;border-radius:5px}input[type=checkbox]{width:20px;height:20px;accent-color:#007861;cursor:pointer}.service{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px;margin:10px 0}.service input[type=text]{width:100%;padding:6px;border:1px solid #bdcbd2;border-radius:5px}.service button{padding:4px}.status{min-height:24px;color:#00634e;font-size:14px}.error{color:#b02a37}.legend{font-size:14px;color:#53666f}.panel{min-width:0}@media(max-width:900px){.workspace{grid-template-columns:1fr;padding:14px}header{padding:18px}aside{display:grid;grid-template-columns:1fr 1fr;gap:20px}}@media(max-width:540px){aside{display:block}.toolbar .row{width:100%}header span{display:none}button{min-height:42px}}
</style></head><body><header><h1>沿线 <span> / 日式车内线路图</span></h1><span>ROUTE MAP STUDIO</span></header><main class="workspace"><aside><section><h2>线路与车站</h2><label class="field">线路名称<input id="lineName" value="青葉線"></label><div class="row"><label class="field">英文名称<input id="lineEnglish" value="Aoba Line"></label><label class="field">统一线路颜色<input id="lineColor" type="color" value="#075ca8"></label></div><div class="row"><label class="field">编号前缀<input id="prefix" value="AO" maxlength="8"></label><label class="field">起始编号<input id="start" type="number" value="1" min="0" max="999"></label></div><label class="field">站名，一行一站<textarea id="stations" spellcheck="false"></textarea></label><p class="hint">英文可省略；用「站名 | 英文」添加双语。</p><button class="primary" id="apply">应用站名</button><p id="status" class="status" role="status" aria-live="polite"></p></section><section><h2>列车级别</h2><div id="services"></div><button id="addService">添加级别</button><p class="hint">普通默认站站停，无需设置；在右侧勾选其他级别的停靠站。</p><h3>图面设置</h3><label class="field">站间距 <span id="spacingLabel">80</span> px<input id="spacing" type="range" min="56" max="180" value="80"></label><label><input id="english" type="checkbox" checked> 显示英文站名</label></section></aside><section class="panel"><div class="toolbar"><h2>线路图预览</h2><div class="row"><button id="svgExport">导出 SVG</button><button class="primary" id="pngExport">导出 PNG · 2 倍</button></div></div><div id="preview" class="preview"></div><div class="toolbar" style="margin-top:24px"><h2>停站与换乘</h2><span class="legend">白色圆点／长条表示停靠　换乘线路用逗号分隔</span></div><div id="matrix" class="editor"></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));let stations=[],services=[{name:'快速',color:'#1687b7',stops:[]},{name:'急行',color:'#ed8b22',stops:[]},{name:'特急',color:'#c62948',stops:[]}];$('stations').value=['青葉中央 | Aoba-chuo','本町 | Honmachi','桜橋 | Sakurabashi','東公園 | Higashi-koen','新川 | Shinkawa','緑ヶ丘 | Midorigaoka','大学前 | Daigaku-mae','北山 | Kitayama','湖畔 | Kohan','空港 | Airport'].join('\n');const status=(s,error=false)=>{$('status').textContent=s;$('status').className='status'+(error?' error':'')};
function apply(){const lines=$('stations').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(lines.length<2||lines.length>100){status('请输入 2–100 个车站。',true);return false}const previous=stations;stations=lines.map(s=>{const [name,...rest]=s.split('|');const clean=name.trim();const old=previous.find(x=>x.name===clean);return{name:clean,en:rest.join('|').trim(),transfer:old?.transfer||'',oldIndex:old?previous.indexOf(old):-1}});if(stations.some(s=>!s.name)){stations=previous;status('站名不能为空。',true);return false}services.forEach((v,k)=>{const old=v.stops;v.stops=stations.map((s,i)=>s.oldIndex>=0?!!old[s.oldIndex]:i===0||i===stations.length-1||(k===0?i%2===0:k===1?i%3===0:i===4))});if(!previous.length){stations[0].transfer='環状線';stations[4].transfer='新川線, 地下鉄東西線';stations[9].transfer='空港連絡線'}editors();draw();status(`已生成 ${stations.length} 站 · ${services.length} 个级别`);return true}
function editors(){const box=$('services');box.replaceChildren();services.forEach((v,k)=>{const row=document.createElement('div');row.className='service';const name=document.createElement('input');name.type='text';name.value=v.name;name.setAttribute('aria-label',`级别 ${k+1} 名称`);name.addEventListener('input',()=>{v.name=name.value;matrix();draw()});const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label',`删除级别 ${v.name}`);del.disabled=services.length===1;del.onclick=()=>{services.splice(k,1);editors();draw()};row.append(name,del);box.append(row)});matrix()}
function matrix(){const table=document.createElement('table');const head=document.createElement('thead');head.innerHTML='<tr><th scope="col">车站</th>'+services.map(v=>`<th scope="col">${esc(v.name||'未命名')}</th>`).join('')+'<th scope="col">换乘线路</th></tr>';const body=document.createElement('tbody');stations.forEach((s,i)=>{const tr=document.createElement('tr');const label=document.createElement('th');label.scope='row';label.textContent=s.name;tr.append(label);services.forEach(v=>{const td=document.createElement('td');const c=document.createElement('input');c.type='checkbox';c.checked=v.stops[i];c.setAttribute('aria-label',`${v.name}停靠${s.name}`);c.onchange=()=>{v.stops[i]=c.checked;draw()};td.append(c);tr.append(td)});const td=document.createElement('td');const input=document.createElement('input');input.type='text';input.value=s.transfer;input.placeholder='例如：環状線, 地下鉄';input.setAttribute('aria-label',`${s.name}换乘线路`);input.oninput=()=>{s.transfer=input.value;draw()};td.append(input);tr.append(td);body.append(tr)});table.append(head,body);$('matrix').replaceChildren(table)}
function draw(){
const gap=Number($('spacing').value),left=85,lane=21,showEn=$('english').checked,c=$('lineColor').value;
$('spacingLabel').textContent=gap;
const labelWidth=s=>Array.from(s.name).length*21+(showEn&&s.en?12+s.en.length*7:0);
const longest=Math.max(120,...stations.map(labelWidth));
const labelHeight=Math.ceil(longest*.707)+24;
const baseY=120+labelHeight;
const right=Math.max(180,Math.ceil(labelWidth(stations.at(-1))*.707)+35);
const w=left+(stations.length-1)*gap+right;
const transferY=baseY+(services.length+1)*lane+72;
const maxTransfer=Math.max(0,...stations.map(s=>Math.max(0,...s.transfer.split(/[,，、]/).map(t=>Array.from(t.trim()).length*15))));
const h=transferY+(maxTransfer?maxTransfer+44:20);
let a=[`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc($('lineName').value)}停站及换乘线路图"><title>${esc($('lineName').value)}线路图</title><rect width="${w}" height="${h}" fill="white"/><style>text{font-family:'Microsoft YaHei','Yu Gothic',sans-serif;fill:#202d3c}</style><rect x="24" y="24" width="5" height="55" fill="${c}"/><text x="40" y="45" font-size="25" font-weight="600">${esc($('lineName').value)}</text><text x="40" y="68" font-size="14">${esc($('lineEnglish').value)}</text><text x="${w-24}" y="44" text-anchor="end" font-size="14">停車駅ご案内 / Guide to stops</text>`];
stations.forEach((s,i)=>{const x=left+i*gap;a.push(`<text transform="translate(${x},${baseY-18}) rotate(-45)" font-size="19" font-weight="600">${esc(s.name)}${showEn&&s.en?'<tspan dx="10" font-size="12">'+esc(s.en)+'</tspan>':''}</text>`)});
const lanes=[{name:'普通',color:c},...services];
lanes.forEach((v,k)=>{const y=baseY+k*lane;const x1=left-24,x2=left+(stations.length-1)*gap+24;a.push(`<rect x="${x1}" y="${y-7}" width="${x2-x1}" height="14" fill="${c}"/><rect x="${x2+10}" y="${y-8}" width="120" height="17" fill="white" stroke="${c}" stroke-width="1"/><text x="${x2+18}" y="${y+5}" font-size="13">${esc(v.name||'未命名')}</text>`)});
stations.forEach((s,i)=>{const x=left+i*gap;const stops=[true,...services.map(v=>!!v.stops[i])];let k=0;while(k<stops.length){if(!stops[k]){k++;continue}let end=k;while(end+1<stops.length&&stops[end+1])end++;const y=baseY+k*lane;if(k===end)a.push(`<circle cx="${x}" cy="${y}" r="5" fill="white" stroke="#26384d" stroke-width="2"/>`);else a.push(`<rect x="${x-5}" y="${y-5}" width="10" height="${(end-k)*lane+10}" rx="4" fill="white" stroke="#26384d" stroke-width="2"/>`);k=end+1}const number=String(Math.max(0,Number($('start').value)||0)+i).padStart(2,'0');a.push(`<rect x="${x-17}" y="${baseY+lanes.length*lane+8}" width="34" height="34" rx="3" fill="white" stroke="${c}" stroke-width="1.5"/><text x="${x}" y="${baseY+lanes.length*lane+21}" text-anchor="middle" font-size="10" style="fill:${c}">${esc($('prefix').value)}</text><text x="${x}" y="${baseY+lanes.length*lane+36}" text-anchor="middle" font-size="14" font-weight="600">${number}</text>`);const transfers=s.transfer.split(/[,，、]/).map(t=>t.trim()).filter(Boolean);transfers.forEach((t,j)=>{const tx=x+(j-(transfers.length-1)/2)*20;if(j===0)a.push(`<line x1="${x}" y1="${transferY-21}" x2="${x}" y2="${transferY-8}" stroke="#617084" stroke-width="1"/>`);a.push(`<text x="${tx}" y="${transferY}" writing-mode="vertical-rl" font-size="14">${esc(t)}</text>`)})});
a.push('</svg>');$('preview').innerHTML=a.join('')}
function download(blob,ext){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=($('lineName').value||'线路图').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('svgExport').onclick=()=>download(new Blob([$('preview').innerHTML],{type:'image/svg+xml;charset=utf-8'}),'svg');$('pngExport').onclick=()=>{const svg=$('preview').querySelector('svg');const w=Number(svg.getAttribute('width'))*2,h=Number(svg.getAttribute('height'))*2;if(w*h>65000000){status('图面过大，请减少车站或站间距，或导出 SVG。',true);return}const u=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml;charset=utf-8'}));const image=new Image();image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(image,0,0,w,h);canvas.toBlob(blob=>{if(blob){download(blob,'png');status('PNG 已导出')}else status('PNG 导出失败，请使用 SVG。',true)},'image/png')}catch(e){status('PNG 导出失败，请使用 SVG。',true)}finally{URL.revokeObjectURL(u)}};image.onerror=()=>{URL.revokeObjectURL(u);status('PNG 导出失败，请使用 SVG。',true)};image.src=u};
$('apply').onclick=apply;$('addService').onclick=()=>{if(services.length>=10){status('最多支持 10 个级别。',true);return}services.push({name:'新级别',color:'#7756a8',stops:stations.map(()=>true)});editors();draw()};['lineName','lineEnglish','lineColor','prefix','start','spacing','english'].forEach(id=>$(id).addEventListener('input',draw));apply();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'configure_route_map',description:'设置线路站名及各级列车停站，替换当前线路图。',inputSchema:{type:'object',properties:{lineName:{type:'string'},stations:{type:'array',minItems:2,maxItems:100,items:{type:'object',properties:{name:{type:'string'},en:{type:'string'},transfer:{type:'string'}},required:['name'],additionalProperties:false}},services:{type:'array',minItems:1,maxItems:10,items:{type:'object',properties:{name:{type:'string'},color:{type:'string'},stops:{type:'array',items:{type:'boolean'}}},required:['name','color','stops'],additionalProperties:false}}},required:['lineName','stations','services'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input.lineName!=='string'||!Array.isArray(input.stations)||input.stations.length<2||input.stations.length>100||!input.stations.every(s=>typeof s.name==='string'&&s.name.trim()&&!/[\n|]/.test(s.name)&&(s.en===undefined||typeof s.en==='string')&&(s.transfer===undefined||typeof s.transfer==='string'))||!Array.isArray(input.services)||!input.services.length||input.services.length>10||!input.services.every(v=>typeof v.name==='string'&&/^#[0-9a-f]{6}$/i.test(v.color)&&Array.isArray(v.stops)&&v.stops.length===input.stations.length&&v.stops.every(s=>typeof s==='boolean')))throw new Error('站名、颜色或停站数组无效');stations=input.stations.map(s=>({name:s.name.trim(),en:s.en||'',transfer:s.transfer||''}));services=input.services.map(v=>({...v,stops:[...v.stops]}));$('lineName').value=input.lineName;$('stations').value=stations.map(s=>s.name+(s.en?' | '+s.en:'')).join('\n');editors();draw();return{stations:stations.length,services:services.length,lineName:input.lineName}}})).catch(()=>{})}catch(e){}}
})();
</script></body></html>
